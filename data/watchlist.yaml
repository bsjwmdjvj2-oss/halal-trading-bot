# Halal candidate universe — business-activity pre-screen only.
#
# This list excludes companies with primary business activity in:
# alcohol, tobacco, gambling, conventional banking/lending, conventional
# insurance, adult entertainment, pork products, and conventional
# defense/weapons manufacturing (per halal_bot.config.ScreeningConfig).
#
# It is NOT a compliance guarantee. Each ticker still goes through the
# quantitative AAOIFI ratio screen (debt ratio, impure income ratio,
# cash+securities ratio) in halal_bot/screening/ before it's eligible for
# the portfolio, and is re-screened on ScreeningConfig.rescreen_interval_days.
# Maintain this list manually; review at each quarterly strategy review
# (Section 6 of SPEC.md).
#
# sector values are used for the sector concentration cap (Section 5).

